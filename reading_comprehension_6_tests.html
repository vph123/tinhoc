*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(135deg,#f7f9ff,#eef4fb);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
.container{width:min(1100px,94%);margin:auto}.hero{padding:34px 0 22px}.hero h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:-1px}.hero p{color:var(--muted);margin:8px 0 0}.score{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,.05);padding:12px 0}.score-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}.score strong{font-size:18px}.score .pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:#edf2ff;color:#3047a8;font-weight:700}.progress{height:7px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.5s}
.test{background:var(--card);border:1px solid var(--border);border-radius:20px;margin:24px 0;padding:22px;box-shadow:var(--shadow)}.test-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.test h2{margin:0 0 4px;font-size:23px}.tag{font-size:12px;color:#3f4d66;background:#f0f3f8;border-radius:999px;padding:5px 10px;white-space:nowrap}.passage{max-height:340px;overflow-y:auto;border:1px solid var(--border);background:#fbfcfe;border-radius:15px;padding:18px;margin:16px 0 22px;white-space:pre-line}.passage-title{font-weight:800;margin-bottom:10px;color:#263a6d}.question{padding:18px 0;border-top:1px solid #edf0f5}.question h3{font-size:17px;margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);padding:11px 13px;border-radius:12px;margin:8px 0;cursor:pointer;transition:.2s;background:#fff}.option:hover{border-color:#9eb0f7;background:#f8faff}.option input{margin-top:5px;accent-color:var(--primary)}.option.locked{cursor:default}.option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}.option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect)}.explanation{display:none;margin-top:12px;padding:15px 16px;border-left:4px solid var(--primary);background:#f6f8ff;border-radius:10px}.explanation strong{color:#243b86}.submit-wrap{text-align:center;padding:30px 0 50px}.submit{border:0;border-radius:14px;padding:15px 24px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(49,94,251,.25)}.submit:hover{transform:translateY(-1px)}.notice{color:var(--muted);font-size:13px;margin-top:10px}.hidden{display:none!important}
@media(max-width:650px){.test{padding:16px;border-radius:16px}.test-head{display:block}.tag{display:inline-block;margin-top:8px}.passage{max-height:310px;padding:14px}.score-inner{align-items:flex-start}.score strong{font-size:15px}.submit{width:100%}}

<script>
const TESTS = [{"id": 1, "title": "Liam Vance talks about taking up photography", "passage": "Liam Vance talks about taking up photography\nWhen I was younger, I used to grab my dad’s old camera and take pictures of everything in our garden. Most of my schoolmates lost interest in creative hobbies as schoolwork got tougher, but I stayed fascinated by photography. Recently, I came to the terrifying conclusion that it was time to display my work publicly by entering a local competition in my hometown. Putting my photos out there for judgment was completely new to me, yet I felt a strong wave of excitement.\nI have never attended any professional art schools. When choosing my major at college, taking a photography course never crossed my mind. My relatives kept advising me to select a degree that offered stable job prospects, so I registered for an accounting program instead. Looking back, I realize my family would have backed me up regardless of my choice, but I decided to follow what seemed safest for my future.\nThroughout my college years, I hardly ever picked up a camera. It was quite difficult to practice anyway, as I shared a small dormitory room with two other students. Still, I remained keen on images and routinely visited photography galleries. It wasn't until my late twenties, while working at an office, that my passion for taking photos returned. Since then, I’ve made sure to dedicate every Saturday afternoon to shooting scenes outdoors.\nUp until now, only close companions and family members have viewed my photographs. They have always given me great encouragement. However, I’ve always been curious about how strangers would evaluate my work—people who could offer an unbiased opinion. The competition organizers have provided a comment book at the venue, allowing visitors to drop their thoughts. I am extremely eager to see what they write.", "questions": [{"number": 6, "text": "What does Liam say about photography?", "options": ["Most of his classmates continued doing it during school.", "He was forced to abandon it to focus on his studies.", "The idea of exhibiting his pictures feels a bit scary.", "He has frequently displayed his pictures in public before."], "answer": "C", "explanation": "Từ khóa: “terrifying conclusion”, “display my work publicly”, “completely new”. Đoạn 1 nói việc đưa ảnh ra công chúng là điều mới và đáng sợ. Paraphrase: “terrifying” → “a bit scary”; “display publicly” → “exhibiting ... to the public”. Bẫy: A trái với việc classmates lost interest; B không bị ép bỏ photography; D trái với “completely new”."}, {"number": 7, "text": "When deciding what to study at college, Liam", "options": ["did not think about studying photography.", "was forbidden by his parents from taking art courses.", "knew he needed to earn money while studying.", "realized his parents would refuse to support his choice."], "answer": "A", "explanation": "Từ khóa: “choosing my major”, “photography course”. Đoạn 2: taking a photography course “never crossed my mind”. Paraphrase: “never crossed my mind” → “did not think about”. Bẫy: B, D đều trái với việc gia đình sẽ ủng hộ; C không được đề cập."}, {"number": 8, "text": "What happened while Liam was at college?", "options": ["He stopped visiting photography exhibitions completely.", "He took photographs every Saturday afternoon.", "He maintained a strong interest in photography.", "He spent a lot of time taking photos in his room."], "answer": "C", "explanation": "Từ khóa: “college years”, “keen on images”, “visited photography galleries”. Đoạn 3 cho biết dù ít cầm máy, Liam vẫn rất quan tâm và thường đến gallery. Paraphrase: “remained keen” → “maintained a strong interest”. Bẫy: A trái với “routinely visited”; B chỉ xảy ra sau khi đam mê trở lại; D không có thông tin."}, {"number": 9, "text": "Liam entered the competition because he", "options": ["was forced to do so by his close friends.", "wanted feedback from people he didn't know.", "hoped to win a financial reward from the venue.", "wished to show his relatives how much he had improved."], "answer": "B", "explanation": "Từ khóa: “competition”, “strangers”, “unbiased opinion”. Đoạn cuối: anh tò mò người lạ đánh giá ảnh và muốn nhận ý kiến khách quan. Paraphrase: “strangers” → “people he didn’t know”; “evaluate” → “feedback”. Bẫy: A, C, D không được bài đọc hỗ trợ."}, {"number": 10, "text": "What would be a good introduction to this article?", "options": ["Liam Vance explains why an accounting degree is better than an art degree.", "After keeping his passion private for years, Liam Vance is ready to show his photos to the public.", "Liam Vance gives advice on how young students can get support from their parents.", "Liam Vance describes how to win a local photography contest without formal training."], "answer": "B", "explanation": "Câu hỏi tổng kết. Toàn bài xoay quanh đam mê photography được giữ khá riêng tư và hiện tại Liam đưa ảnh ra công chúng để nhận đánh giá. Paraphrase: “only close companions and family” → “kept ... private”; “display publicly” → “show ... to the public”. Bẫy: A/C/D chỉ là chi tiết phụ hoặc thông tin không được nêu."}]}, {"id": 2, "title": "Headteacher David Miller talks about introducing music in school", "passage": "Headteacher David Miller talks about introducing music in school\nEver since I became the headmaster at Oakridge Primary, my priority has been to help pupils experience the benefits of musical education. I began by collaborating with our music instructor to create brand new weekly workshops featuring various instruments. We update the playlist every few days so that children can discover different musical genres and minimize their screen time during breaks. The students have responded wonderfully and are now listening to a wide range of classical and modern tunes.\nWe have also transformed an unused storage building on the school grounds into a recording space and integrated song production into our daily lessons. Pupils now set up the equipment, record melodies, and observe how a track comes together. We are currently preparing to build a small outdoor stage so our students can experience the joy of performing live. I am convinced this gives young people a deeper appreciation of music and useful abilities that will remain with them forever.\nTo further promote this musical initiative, we have modified the schedule to increase physical activity through rhythm. Every morning before lessons start, we host a brief dance routine in the hall where kids can burn off energy to lively tunes. We also hold break times in stages so the hall doesn't get overcrowded, allowing pupils to move around safely. Furthermore, we have purchased new instruments like drums, keyboards, and guitars to motivate pupils to form bands.\nHowever, it is not only the youngsters who are adopting musical habits. A number of our teachers have signed up for the town's amateur choir this autumn for the first time and have started practicing regularly. Many pupils have followed their example and joined the group as well. I am certain that performing alongside their educators will inspire them to succeed. A few parents have even expressed a desire to participate, which fills us all with anticipation.", "questions": [{"number": 6, "text": "Since David joined the school,", "options": ["screen time has been completely banned for pupils.", "the school music playlist changes frequently.", "a new music teacher has been hired.", "music workshops take place twice a month."], "answer": "B", "explanation": "Từ khóa: “playlist”, “every few days”. Đoạn 1 nói playlist được cập nhật vài ngày một lần. Paraphrase: “update every few days” → “changes frequently”. Bẫy: A chỉ nói giảm screen time, không cấm hoàn toàn; C giáo viên âm nhạc đã có; D workshop là weekly."}, {"number": 7, "text": "What does David say about song production?", "options": ["It takes place in a room outside the main building.", "Children use it to create music for the local community.", "It is only taught to children who can play an instrument.", "It takes place on an outdoor stage."], "answer": "A", "explanation": "Từ khóa: “song production”, “unused storage building”. Đoạn 2 nói kho chứa không sử dụng được chuyển thành recording space. Paraphrase: “unused storage building” → “a room outside the main building”. Bẫy: B không được nêu; C sai vì pupils nói chung tham gia; D sân khấu ngoài trời mới đang chuẩn bị xây."}, {"number": 8, "text": "The morning dance sessions", "options": ["are designed to help children burn off extra energy before class.", "cause the school hall to become extremely crowded.", "cost the school a large amount of extra money.", "replace all regular physical exercise classes."], "answer": "A", "explanation": "Từ khóa: “morning”, “burn off energy”, “before lessons”. Đoạn 3 nói dance routine diễn ra mỗi sáng trước giờ học để trẻ tiêu hao năng lượng. Paraphrase: “burn off energy” → “get rid of extra energy”. Bẫy: B trái với việc chia giờ nghỉ để tránh đông; C/D không được đề cập."}, {"number": 9, "text": "What does David mention about the teachers?", "options": ["They have performed in the town choir for many years.", "They are rehearsing for a choir event alongside some pupils.", "They are giving free music lessons to parents.", "They prefer practicing without the children present."], "answer": "B", "explanation": "Từ khóa: “teachers”, “amateur choir”, “pupils followed”. Đoạn cuối: giáo viên mới tham gia choir và học sinh cũng tham gia, cùng biểu diễn. Paraphrase: “performing alongside their educators” → “choir event alongside some pupils”. Bẫy: A trái với “for the first time”; C/D không có."}, {"number": 10, "text": "What would be a good introduction to this article?", "options": ["Headmaster David Miller describes how he became a professional musician.", "David Miller explains how his school successfully created a culture centered around music.", "Read about how David Miller was ordered to improve the school's test results.", "David Miller shares his personal journey of joining a town choir with his colleagues."], "answer": "B", "explanation": "Câu tổng kết: bài nói về hàng loạt thay đổi để âm nhạc trở thành một phần đời sống trường học: workshops, recording, dance, instruments, choir. Paraphrase “promote musical initiative” → “culture centered around music”. Bẫy: A/C/D không phản ánh toàn bài."}]}, {"id": 3, "title": "Mountain Hiking Adventure by Maya Lin", "passage": "Mountain Hiking Adventure by Maya Lin, 16\nA few months ago, my cousin Ethan was describing a hiking trip he had taken in the Swiss Alps. I wanted to tell him that I was about to embark on a similar journey in the Scottish Highlands, where my aunt and uncle reside. Wild deer had recently been spotted on the trails there, and my relatives were certain we would encounter some—so I was confident my trek would be just as thrilling as Ethan's! However, I later read a few online comments about the route my father had selected, mentioning that hikers rarely saw any wildlife at all. Consequently, I decided to keep my plans to myself, just in case our expedition failed to deliver!\nAnyway, Dad and I set off on our trek—which was entirely Dad's plan—and it turned out to be brilliant! Walking up the steep trail with our leader, we soon arrived at the valley where deer frequently gathered. We stood there waiting—but nothing appeared. I was sure our luck would change, though. Other hikers kept shouting that they had spotted a deer, which created much excitement—yet it turned out they were mistaken. Then, at last, I noticed something moving behind some trees—a magnificent red deer! I felt like a hero for the rest of the day!\nThe animal was an amazing sight, with its impressive antlers standing just a short distance from us. Our guide mentioned it weighed around 150 kilograms and was nearly two meters tall. Yet, despite its enormous size, it moved through the rough landscape gracefully and without any difficulty. We waited to see if others would join it, and shortly afterwards, we spotted three more further up the slope, leaping over rocks before disappearing into the mist.\nAlthough the altitude isn't extremely high in this region, larger mammal species thrive here, feeding on mountain vegetation. However, red deer are naturally curious, making them more likely to approach human walking groups—which explains why our trip was successful! Afterwards, standing on the summit, we scanned the landscape below for further signs of life. Sadly, we had no further luck—but we definitely intend to return!", "questions": [{"number": 11, "text": "Maya hesitated to tell Ethan about her trip because", "options": ["she felt his expedition sounded much more adventurous.", "she came across negative reviews regarding her destination.", "she wasn't sure if her father had finalized the booking.", "she believed he had no interest in mountain wildlife."], "answer": "B", "explanation": "Từ khóa: “hesitated”, “online comments”, “rarely saw wildlife”. Đoạn 1 nói Maya đọc bình luận tiêu cực về tuyến đường và sợ chuyến đi không thành công. Paraphrase: “online comments” → “reviews”; “rarely saw wildlife” → “negative reviews”. Bẫy A/C/D không được hỗ trợ."}, {"number": 12, "text": "On the hiking trail, Maya", "options": ["was proud that she was the first to spot a deer.", "became worried that the guide had lost the way.", "tried to convince her father to turn back early.", "was glad she had chosen the route herself."], "answer": "A", "explanation": "Từ khóa: “noticed something moving”, “red deer”, “hero”. Maya là người cuối cùng trong đoạn cao trào nhận ra con hươu đầu tiên và cảm thấy như một người hùng. Paraphrase “felt like a hero” → cảm giác tự hào. Bẫy B/C/D trái với nội dung: route là kế hoạch của Dad, không phải Maya."}, {"number": 13, "text": "When Maya saw the red deer, she was", "options": ["surprised by how close it came to her group.", "impressed by how easily it moved despite its large size.", "shocked by its weight compared to what she expected.", "thrilled that it stayed with them for several hours."], "answer": "B", "explanation": "Từ khóa: “enormous size”, “moved ... gracefully and without any difficulty”. Câu hỏi paraphrase trực tiếp: “despite its large size” ↔ “despite its enormous size”; “moved easily” ↔ “without any difficulty”. Bẫy A chỉ nói nó ở khoảng cách ngắn nhưng không phải ý chính; C/D không có."}, {"number": 14, "text": "Maya suggests they saw red deer near the trail because these animals", "options": ["are attracted to the food brought by hikers.", "tend to be inquisitive towards human groups.", "cannot find enough vegetation at higher altitudes.", "prefer living near lowland valleys."], "answer": "B", "explanation": "Từ khóa: “naturally curious”, “approach human walking groups”. Đây là nguyên nhân được tác giả nêu trực tiếp. Paraphrase: “curious” → “inquisitive”; “approach” → hướng tới human groups. Bẫy A/C/D không được bài đọc nói."}, {"number": 15, "text": "What might Maya text her cousin Ethan during the trip?", "options": ["Dad said he wished we had gone to the Swiss Alps like you, but I prefer Scotland!", "You were so confident we'd see wild deer, but I had my doubts—turns out you were right after all!", "I'll send you the footage of the deer group—they vanished so fast, but it was incredible!", "We've been seeing deer at every single stop along the trail, just as my aunt promised!"], "answer": "C", "explanation": "Câu tổng kết phải khớp cuối trải nghiệm: Maya đã thấy một nhóm hươu, chụp/ghi lại? Bài chỉ nói spotted three more, không nói footage. Vì vậy trong 4 lựa chọn, C là lựa chọn gần nhất về việc nhóm hươu biến mất nhanh và trải nghiệm đáng kinh ngạc; tuy nhiên “footage” không được bài đọc xác nhận. Đây là câu có chi tiết gây nhiễu; nếu bám tuyệt đối văn bản, không lựa chọn nào hoàn toàn khớp. Mình giữ nguyên đáp án theo bộ câu hỏi nhưng đánh dấu đây là câu cần thận trọng."}]}, {"id": 4, "title": "Exploring the Amazon Rainforest by Lucas Silva", "passage": "Exploring the Amazon Rainforest by Lucas Silva, 15\nMy family and I recently travelled to South America to visit my godparents. But before heading to their town, we went on a guided tour along the Amazon River in Brazil. My mother had originally planned for us to hire a private canoe, but even though she was skilled at paddling long distances, she read on a travel forum that the river currents were exceptionally strong with hidden obstacles. We agreed she deserved to relax and appreciate the incredible scenery, which she couldn't do while steering. Thus, we convinced her to purchase tickets for a large riverboat instead.\nOur first stop was an area known for wild pink river dolphins. Mum and I were walking along a wooden pier when a huge dolphin surfaced! For a second, it seemed ready to swim closer to us, which made me slightly anxious—but then it turned away, pausing occasionally as if checking whether we were watching. Although it stayed nearby for a while, I was so amazed that I completely forgot to pull out my phone to take a picture. Finally, it splashed its tail and dived deep underwater.\nThat wasn't the only creature we encountered. I had assumed it was unlikely we would spot any sloths during our brief journey, as I'd heard they were well-hidden—but we were pleasantly surprised at our next stop. In fact, we discovered there were dozens of them hanging in the canopy! Unfortunately, some trees had lost most of their leaves, which local guides blamed on insect swarms, though I'd read that rising temperatures were the actual cause. Still, they looked charming and were simple to spot—we just followed the groups of tourists pointing up into the branches!\nMy father had booked an eco-lodge for the night, featuring wooden cabins in the jungle. I was somewhat uncertain about staying there, but they turned out to be luxurious rooms within walking distance of breathtaking waterfalls. However, Dad mentioned that the sounds of nocturnal animals would help us rest. That sounded alarming—until the 'wild animals' turned out to be tiny tree frogs! I felt foolish about my worries—though the loud croaking kept me awake all night!", "questions": [{"number": 11, "text": "Lucas’s mother decided against paddling a canoe because", "options": ["she realized she wouldn't be able to enjoy the surrounding views.", "she was concerned that the physical effort would exhaust her.", "she found out that buying boat tickets was a cheaper option.", "she discovered that navigating the river was quite dangerous."], "answer": "A", "explanation": "Từ khóa: “relax”, “appreciate scenery”, “steering”. Đoạn 1 nói mẹ có thể chèo nhưng không thể vừa lái vừa thưởng ngoạn cảnh; ngoài ra dòng chảy mạnh và chướng ngại ẩn khiến việc đi canoe rủi ro. Paraphrase “couldn’t ... appreciate scenery while steering” → “wouldn’t be able to enjoy surrounding views”. Bẫy B/C không có; D có yếu tố nguy hiểm nhưng lý do được diễn đạt chính là muốn thư giãn và ngắm cảnh."}, {"number": 12, "text": "When Lucas saw the pink dolphin, he was", "options": ["concerned that it might come too close to him.", "astonished by how large its body was.", "unhappy that it swam away so quickly.", "disappointed that he missed the chance to photograph it."], "answer": "A", "explanation": "Từ khóa: “seemed ready to swim closer”, “slightly anxious”. Paraphrase “slightly anxious” → “concerned”; “swim closer” → “come too close”. Bẫy B: huge có trong bài nhưng không phải lý do cảm xúc; C trái với amazement; D bài nói quên lấy điện thoại, không diễn tả disappointment."}, {"number": 13, "text": "Lucas notes that the sloths they observed were", "options": ["damaging the leaves on the jungle trees.", "much easier to locate than he had anticipated.", "harder to spot than other rainforest animals.", "frightened away by the noisy crowds of tourists."], "answer": "B", "explanation": "Từ khóa: “assumed unlikely”, “dozens”, “simple to spot”. Paraphrase “simple to spot” → “easier to locate than anticipated”. Bẫy A là cây mất lá nhưng nguyên nhân được nói là nhiệt độ tăng; C trái với “simple”; D không có."}, {"number": 14, "text": "What was Lucas’s view of their accommodation?", "options": ["It was far less comfortable than he had expected.", "Its location made it convenient for visiting natural attractions.", "He enjoyed falling asleep to the peaceful sounds of frogs.", "He was annoyed that there were no places to eat nearby."], "answer": "B", "explanation": "Từ khóa: “luxurious rooms”, “within walking distance”, “waterfalls”. Paraphrase “within walking distance” → “location made it convenient”. Bẫy C trái vì tiếng ếch lớn khiến Lucas thức cả đêm; A trái với “luxurious”; D không được đề cập."}, {"number": 15, "text": "What might Lucas write in his travel blog after the trip?", "options": ["I was nervous about sleeping in the jungle because of dangerous beasts, but it turned out there was nothing to fear!", "The riverboat was okay, but I really wish Mum had let us row our own canoe so we could explore better.", "We visited some famous waterfalls near our cabin, but I was surprised by how few tourists were there.", "I took so many photos of the pink dolphin when it came up to the pier—I can't wait to show everyone!"], "answer": "A", "explanation": "Câu tổng kết: Lucas lo lắng về động vật ban đêm nhưng cuối cùng đó chỉ là ếch cây nhỏ; tuy nhiên tiếng kêu khiến cậu mất ngủ. Paraphrase “uncertain/alarming” → “nervous”; “tiny tree frogs” → “nothing dangerous”. Bẫy B trái với quyết định chọn riverboat; C không nói ít khách; D trái với việc quên lấy điện thoại."}]}, {"id": 5, "title": "Hannah Abbott talks about her pottery studio", "passage": "Hannah Abbott talks about her pottery studio\nLike many kids, I was always covering myself and the kitchen floor in clay when I first took an interest in making pots. Unlike most young people, who abandon creative pursuits for academic subjects as they grow older, I kept making ceramics throughout my youth. Now, after years of practicing as a hobby, I’ve finally taken the nerve-wracking step to display my handmade bowls and vases by setting up a stall at the central market. Exposing my creations to the public is a completely new step, but one I am thrilled about.\nI have never received any formal artistic education. When I was deciding what degree to pursue at university, studying art never entered my mind. I always believed my parents wanted me to choose a discipline that would guarantee employment, so I ended up graduating in computer science. Looking back, my family would likely have encouraged me whatever path I picked, but I chose to do what seemed most sensible for my future.\nDuring my university days, I rarely touched clay. It wouldn't have been easy anyway, as I resided in student housing with extremely limited space. I maintained a fascination with craft though, visiting local pottery markets whenever time allowed. It was later in my thirties, while working as a software developer, that I re-ignited my passion for shaping clay. Since then, I’ve made a habit of spending at least one evening every week at a community workshop.\nUntil recently, my ceramic pieces had only ever been viewed by reliable friends and family. They’ve always offered endless encouragement. However, I’ve always wondered what people who didn't know me would think—individuals who could offer an honest evaluation of my skills. The market organizers have been very supportive and assigned me a prime spot. They’ve suggested I leave a feedback notebook for visitors' thoughts. I’m really looking forward to reading their comments.", "questions": [{"number": 6, "text": "What does Hannah say about pottery?", "options": ["Most young people continue practicing it into adulthood.", "She was forced to stop making pots due to her university studies.", "The thought of selling her work to the public feels somewhat intimidating.", "She has regularly sold her pots at local markets in the past."], "answer": "C", "explanation": "Từ khóa: “nerve-wracking”, “display ... to the public”, “completely new”. Paraphrase “nerve-wracking” → “somewhat intimidating”. Bẫy A trái với “most ... abandon”; B không bị ép; D trái với “completely new step”."}, {"number": 7, "text": "When selecting her university course, Hannah", "options": ["did not consider taking a degree in art.", "was instructed by her parents to study computer science.", "realized she needed to work part-time while studying.", "knew her parents would disapprove of any artistic subject."], "answer": "A", "explanation": "Từ khóa: “deciding what degree”, “studying art never entered my mind”. Paraphrase “never entered my mind” → “did not consider”. Bẫy B/D vì Hannah chỉ believed parents wanted a practical discipline, nhưng nhìn lại gia đình có thể đã ủng hộ; C không có."}, {"number": 8, "text": "While attending university, Hannah", "options": ["stopped attending craft markets altogether.", "spent one evening a week making pots in her room.", "remained interested in the craft of pottery.", "lost all passion for creative activities."], "answer": "C", "explanation": "Từ khóa: “university days”, “maintained a fascination”, “visiting local pottery markets”. Paraphrase “maintained a fascination” → “remained interested”. Bẫy A/D trái với bài; B thời gian một buổi/tuần chỉ xuất hiện sau khi passion trở lại và ở community workshop."}, {"number": 9, "text": "Hannah is setting up a stall because she wants to", "options": ["earn enough money to open her own workshop.", "prove to her family that her pots are high quality.", "discover what unfamiliar visitors think of her work.", "follow the advice of her university professors."], "answer": "C", "explanation": "Từ khóa: “people who didn't know me”, “honest evaluation”, “feedback notebook”. Paraphrase “unfamiliar visitors” → “people who didn't know me”; “what they think” → “evaluation”. Bẫy A/B/D không được nêu."}, {"number": 10, "text": "What would be a good introduction to this article?", "options": ["Hannah Abbott shares her tips on how to balance a software job with university studies.", "After years of making ceramics in private, Hannah Abbott is preparing to present her work to strangers.", "Hannah Abbott explains why studying computer science is essential for young artists.", "Learn how Hannah Abbott convinced her family to support her artistic career path."], "answer": "B", "explanation": "Câu tổng kết: nhiều năm chỉ bạn bè/gia đình xem sản phẩm, nay Hannah đưa tác phẩm ra thị trường để người lạ đánh giá. Paraphrase “only friends and family” → “in private”; “people who didn't know me” → “strangers”. Bẫy A/C/D không phải trọng tâm toàn bài."}]}, {"id": 6, "title": "Sailing along the Fjords by Oliver Grant", "passage": "Sailing along the Fjords by Oliver Grant, 15\nA while ago, my friend Chloe was telling me about a boat trip she’d taken through the Norwegian fjords. I was eager to mention that I was about to do something similar along the west coast of Scotland, where my grandparents live. Sea eagles had recently returned to the area, and my grandparents were convinced we would see some—so I felt sure my trip would be just as amazing as Chloe’s! But then I came across some online reviews of the boat tour my father had booked, stating that tourists rarely saw any eagles at all. So, in the end, I decided not to say anything to Chloe about my voyage, in case it proved disappointing!\nAnyway, Dad and I set off on our boat trip—which was Dad’s idea—and it was fantastic! Cruising out into the bay with our captain, we soon arrived at the cliffs where eagles often nested. Then we waited—and nothing happened. I was sure our luck would change, though. Passengers kept shouting that they’d spotted an eagle, which was exciting—but it turned out they were mistaking seagulls for eagles. Then finally, I saw a large silhouette soaring high above the rocks—a golden eagle! I felt like a hero for the rest of the day!\nThe eagle was a marvellous sight, with its huge wingspan visible against the sky. Our guide said it had a wingspan of over two meters and could fly at remarkable speeds. Yet, despite its size, it glided through the air effortlessly. We waited to see if its mate would appear, and a short time later, we saw another eagle further down the coast, diving towards the water before climbing back up into the clouds. Just after I’ve filmed them, they flew behind the mountains.\nAlthough the weather can be unpredictable around the coast, these massive birds of prey thrive here, hunting for small mammals and fish. But golden eagles are territorial creatures, so they often patrol the same coastal routes—which was why we were successful! Later, up on the viewing tower, we looked out towards the hills, searching for more wildlife. We were unlucky, sadly—but we’ll definitely be back!", "questions": [{"number": 11, "text": "Oliver didn't tell Chloe about his upcoming boat trip because", "options": ["he thought her trip in Norway sounded far more impressive.", "he read some unpromising feedback about the tour he was taking.", "he wasn't sure if his father had actually bought the tickets.", "he knew she didn't care much about wild birds."], "answer": "B", "explanation": "Từ khóa: “online reviews”, “rarely saw any eagles”, “didn’t say anything”. Paraphrase “unpromising feedback” → “rarely saw any eagles”. Bẫy A/C/D không được hỗ trợ."}, {"number": 12, "text": "While on the boat, Oliver", "options": ["felt proud to be the first passenger to spot the golden eagle.", "began to worry that the tour would end without seeing anything.", "tried to stop other passengers from getting overly excited.", "was glad he had persuaded his father to choose this specific tour."], "answer": "B", "explanation": "Từ khóa: “waited”, “nothing happened”, “luck would change”. Oliver chưa thấy đại bàng và bắt đầu lo chuyến đi có thể không có gì đáng xem. Paraphrase “nothing happened” → lo tour kết thúc mà không thấy gì. Bẫy A: người khác hô trước nhưng nhầm; C/D không có."}, {"number": 13, "text": "When Oliver watched the golden eagle, he was", "options": ["surprised by how close to the boat it flew.", "astonished by how huge its wings were in person.", "impressed by how smoothly it moved through the air.", "delighted that it was flying together with a large flock."], "answer": "C", "explanation": "Từ khóa: “despite its size”, “glided ... effortlessly”. Paraphrase “glided effortlessly” → “moved smoothly”. Bẫy B: wingspan lớn có thật nhưng câu hỏi nhấn vào cách di chuyển; A/D không có."}, {"number": 14, "text": "Oliver explains that they managed to see the eagles because these birds", "options": ["are used to being fed by tourists on boats.", "regularly fly over the same areas to protect their territory.", "prefer nesting near crowded viewing towers.", "are attracted to the noise made by the boat engine."], "answer": "B", "explanation": "Từ khóa: “territorial”, “patrol the same coastal routes”. Paraphrase “territorial” + “same routes” → “regularly fly over same areas to protect territory”. Bẫy A/C/D không được đề cập."}, {"number": 15, "text": "What message might Oliver send to his grandparents after the trip?", "options": ["I'll send you the video I took of the eagles—they didn't stay long, but it was amazing!", "Dad said he wishes we had gone to Norway like Chloe, but I'm glad we stayed here.", "You were so right that we'd see eagles today, even though I was secretly worried we wouldn't!", "We should go up to the viewing tower tomorrow—we saw eagles every time we looked up!"], "answer": "A", "explanation": "Câu tổng kết cần khớp toàn bộ trải nghiệm: Oliver đã quay phim hai con đại bàng, chúng bay khuất sau núi, trải nghiệm rất tuyệt. Paraphrase “filmed them” → “video I took”; “flew behind the mountains” → “didn’t stay long”. Bẫy B trái với việc chuyến đi tuyệt vời; C/D thêm thông tin không đúng."}]}];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){
  app.innerHTML=TESTS.map(t=>`
  <section class="test">
    <div class="test-head"><div><h2>${esc(t.title)}</h2><div style="color:#667085">Test ${t.id}</div></div><span class="tag">${t.id<=2||t.id===5?'PART 2':'PART 3'}</span></div>
    <div class="passage"><div class="passage-title">Bài đọc</div>${esc(t.passage)}</div>
    ${t.questions.map(q=>`
      <article class="question" data-answer="${q.answer}">
        <h3>Câu ${q.number}. ${esc(q.text)}</h3>
        ${q.options.map((o,i)=>{const letter=String.fromCharCode(65+i);return `<label class="option" data-letter="${letter}"><input type="radio" name="q${q.number}" value="${letter}"><span><b>${letter}.</b> ${esc(o)}</span></label>`}).join('')}
        <div class="explanation"><strong>🔎 Lời giải thích từ Chuyên gia</strong><p>${esc(q.explanation)}</p></div>
      </article>`).join('')}
  </section>`).join('');
}
render();
document.getElementById('submitBtn').addEventListener('click',()=>{
  const questions=[...document.querySelectorAll('.question')];
  let correct=0;
  questions.forEach(q=>{
    const answer=q.dataset.answer;
    const chosen=q.querySelector('input:checked')?.value;
    q.querySelectorAll('.option').forEach(o=>{
      const letter=o.dataset.letter;
      o.classList.add('locked');
      if(letter===answer)o.classList.add('correct');
      if(chosen===letter && chosen!==answer)o.classList.add('incorrect');
      o.querySelector('input').disabled=true;
    });
    q.querySelector('.explanation').style.display='block';
    if(chosen===answer)correct++;
  });
  const total=questions.length, pct=Math.round(correct/total*100);
  document.getElementById('scoreText').textContent=`Kết quả: ${correct}/${total} câu đúng`;
  document.getElementById('percent').textContent=pct+'%';
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('scoreBoard').scrollIntoView({behavior:'smooth',block:'start'});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('submitBtn').style.opacity='.55';
  document.getElementById('submitBtn').textContent='ĐÃ NỘP BÀI';
});
</script>
