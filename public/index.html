<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Bài Thi Trắc Nghiệm AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .divider { text-align: center; font-weight: bold; color: #888; margin: 15px 0; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #status { margin-top: 12px; text-align: center; font-size: 14px; font-weight: 500; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Tạo Bài Thi Trắc Nghiệm AI</h2>
        <form id="quizForm">
            <div class="form-group">
                <label for="topic">1. Nhập chủ đề:</label>
                <input type="text" id="topic" placeholder="Ví dụ: Present Simple...">
            </div>

            <div class="divider">HOẶC</div>

            <div class="form-group">
                <label for="fileInput">2. Tải file tài liệu (Mọi định dạng: PDF, Word, TXT, Ảnh,...):</label>
                <input type="file" id="fileInput" accept="*/*">
            </div>

            <div class="form-group">
                <label for="questionCount">3. Số lượng câu hỏi (Để trống nếu muốn AI tự đề xuất):</label>
                <input type="text" id="questionCount" placeholder="Tự động theo độ dài bài">
            </div>

            <button type="submit" id="submitBtn">Tạo Bài Thi & Mở Trang Thi</button>
            <div id="status"></div>
        </form>
    </div>

    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    resolve({
                        inlineData: {
                            data: reader.result.split(',')[1],
                            mimeType: file.type || "application/octet-stream"
                        }
                    });
                };
                reader.onerror = err => reject(err);
            });
        }

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topic = document.getElementById('topic').value.trim();
            const fileInput = document.getElementById('fileInput');
            const questionCount = document.getElementById('questionCount').value.trim();
            const file = fileInput.files[0];

            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            if (!topic && !file) {
                status.className = 'error';
                status.innerText = 'Vui lòng nhập chủ đề hoặc chọn file!';
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ AI đang phân tích dữ liệu...';
            status.className = '';
            status.innerText = 'Quá trình có thể mất vài giây tùy vào độ dài file...';

            try {
                let payload = { topic, numQuestions: questionCount, fileData: null };
                if (file) {
                    payload.fileData = await fileToBase64(file);
                }

                const response = await fetch('/api/generate-quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success && result.data) {
                    localStorage.setItem('currentQuizData', JSON.stringify(result.data));
                    status.className = 'success';
                    status.innerText = 'Tạo thành công! Đang chuyển hướng...';
                    setTimeout(() => {
                        window.location.href = 'quiz.html';
                    }, 500);
                } else {
                    throw new Error(result.error || 'Tạo đề thi thất bại.');
                }
            } catch (err) {
                console.error(err);
                status.className = 'error';
                status.innerText = err.message || 'Lỗi kết nối tới Server!';
                btn.disabled = false;
                btn.innerText = 'Tạo Bài Thi & Mở Trang Thi';
            }
        });
    </script>
</body>
</html>
