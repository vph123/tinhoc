<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Trắc Nghiệm Tiếng Anh</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background-color: #cccccc; }
        .question-card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 5px; }
        .option { margin: 5px 0; }
        #loading { display: none; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h2>Tạo Bài Thi Trắc Nghiệm Tiếng Anh</h2>
    
    <div class="form-group">
        <label for="topic">Chủ đề:</label>
        <input type="text" id="topic" placeholder="Ví dụ: Present Simple, Vocabulary Unit 1..." value="Present Simple">
    </div>

    <div class="form-group">
        <label for="numQuestions">Số lượng câu hỏi:</label>
        <input type="number" id="numQuestions" value="5" min="1" max="10">
    </div>

    <button id="btnGenerate" onclick="generateQuiz()">Tạo Bài Thi</button>
    
    <p id="loading">Đang kết nối Gemini AI để tạo câu hỏi, vui lòng đợi giây lát...</p>
    <div id="quizContainer"></div>

    <script src="script.js"></script>
</body>
</html>
